    요약: A CMOS-based resistive processing unit (RPU) for a neural network. The RPU includes a capacitor device configured to store a charge representing a weight value associated with a neural network circuit operation. A current source Field Effect Transistor (FET) device is operatively connected to the capacitor device for increasing a charge on the capacitor. A current sink FET device operatively connected to the capacitor device is configured for decreasing the stored capacitor charge. An analog weight update circuit receives one or more update signals generated in conjunction with the neural network circuit operation, the analog weight update circuit controlling the current source FET device and the current sink FET device.
    AI요약(목적): 아날로그 웨이트 업데이트를 이용하는 심층 신경망을 위한 커패시터 기반의 CMOS 저항 처리 유닛(RPU)을 제공한다.
    ```

