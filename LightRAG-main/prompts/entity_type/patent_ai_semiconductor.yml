entity_types_guidance: |
  Extract only technical knowledge graph entities and relationships from AI semiconductor patent text.
  Use Korean descriptions unless an entity name is a technical English term.

  Do not extract administrative metadata as entities:
  - patent_id, application number, publication number, registration number
  - IPC/CPC classification codes
  - country codes and nationalities such as US, KR, JP, CN, EP, WO
  - legal status values such as 등록, 공개, 거절, 소멸
  - application/publication/registration dates and years
  - claim numbers such as 청구항1
  - category/subcategory codes such as AA, AB, AC, AD, AAA, AAD, ACC

  Also avoid making broad document labels into entities, such as "AI 반도체 특허" or "특허 문서".
  If a category name is only administrative classification, do not extract it.

  Classify each extracted entity using one of these types:
  - TechComponent: hardware components, circuits, units, devices, memory blocks, processing elements, buses, interfaces
  - Architecture: system, processor, memory, packaging, interconnect, accelerator, or in-memory computing architecture
  - Operation: neural-network operation, matrix operation, data movement, scheduling, control, read/write, update, fusion, compilation
  - Method: algorithm, procedure, manufacturing process, optimization method, execution method
  - Material: semiconductor, device, packaging, wiring, electrode, memory cell, or process material when technically central
  - PerformanceMetric: throughput, latency, power consumption, bandwidth, efficiency, accuracy, density, timing parameter
  - ApplicationDomain: neural network, artificial intelligence processor, transformer workload, object detection, recommendation, inference
  - Organization: applicant or owner only when it is technically relevant to the narrative; otherwise skip
  - Other: use only when the entity is clearly technical but no type fits

  Extract relationships only between extracted technical entities.
  Prefer concise technical relationship keywords such as:
  - 구성요소, 포함, 연결, 저장, 판독, 제어, 생성, 수행, 최적화, 가속, 융합, 컴파일, 데이터 전송, 아키텍처 활용

